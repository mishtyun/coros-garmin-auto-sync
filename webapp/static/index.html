<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Coros → Garmin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/webapp/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <span class="app-logo">🏃</span>
      <div>
        <div class="app-name">Coros → Garmin</div>
        <div class="app-sub" id="header-sub">sync dashboard</div>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>
  </header>

  <main id="tab-dashboard" class="tab-panel">
    <div class="segmented" id="period-switch">
      <button class="seg active" data-period="week">This week</button>
      <button class="seg" data-period="last_week">Last week</button>
      <button class="seg" data-period="month">This month</button>
    </div>

    <section id="stats-card">
      <div class="skeleton-block" style="height:120px"></div>
    </section>

    <section class="card">
      <div class="card-title">Last 7 days</div>
      <div id="activities-list">
        <div class="skeleton-block" style="height:96px"></div>
      </div>
    </section>

    <div class="actions">
      <button class="btn btn-primary" id="btn-sync-today">Sync today</button>
      <button class="btn btn-tinted" id="btn-sync-latest">Sync latest</button>
    </div>
    <div id="sync-result"></div>
  </main>

  <main id="tab-settings" class="tab-panel hidden">
    <section class="card" id="settings-card">
      <div class="skeleton-block" style="height:150px"></div>
    </section>
    <section class="card hidden" id="account-card"></section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="/webapp/app.js"></script>
</body>
</html>
