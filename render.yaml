services:
  - type: web
    name: auth-sync-service-dev
    runtime: docker
    plan: free
    region: frankfurt
    branch: dev
    dockerfilePath: ./deploy/Dockerfile
    envVars:
      - key: CELERY_BROKER
        fromService:
          name: celery-redis
          type: redis
          property: connectionString

  - type: redis
    name: celery-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
